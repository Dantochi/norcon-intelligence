<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/norcon-logo.png" />
    <title>NorCon Projects</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #0D2B1B;
      }
      body {
        min-height: 100vh;
      }
      button, input, textarea, select {
        font: inherit;
      }

      input[type="date"] {
        appearance: none;
        -webkit-appearance: none;
        background: #183D28;
        border: 1px solid #1F4D34;
        border-radius: 8px;
        color: #E5F0E8;
        min-height: 38px;
        padding: 8px 12px;
        outline: none;
        transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
      }

      input[type="date"]:focus {
        border-color: #3a9962;
        box-shadow: 0 0 0 3px rgba(58, 153, 98, 0.18);
      }

      input[type="date"]::-webkit-datetime-edit {
        color: #E5F0E8;
      }

      input[type="date"]::-webkit-calendar-picker-indicator {
        cursor: pointer;
        filter: invert(0.9) sepia(0.3) saturate(1.6) brightness(1.1) hue-rotate(-10deg);
        opacity: 0.95;
        margin-left: 4px;
      }

      input[type="date"]::-webkit-clear-button {
        display: none;
      }

      input[type="date"]::-moz-calendar-picker-indicator {
        cursor: pointer;
        filter: brightness(1.4);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
